<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="layout.js?v=1"></script>
<link rel="stylesheet" href="design-tokens.css?v=10">
<link rel="stylesheet" href="pos-chrome.css?v=3">
<link rel="stylesheet" href="layout-presets.css?v=1">
<title>Deckel</title>
<link rel="stylesheet" href="tab_select.css?v=15">
<link rel="stylesheet" href="status.css?v=3">
<script>
(function () {
    if (typeof window.getGastroApiBase !== "function") {
        window.getGastroApiBase = function () {
            if (window.GASTRO_API_BASE) return window.GASTRO_API_BASE;
            var p = window.location.protocol;
            var h = window.location.hostname || "";
            if (p === "https:" && /(^|\.)mpbin\.de$/i.test(h)) return "https://api.mpbin.de";
            return p + "//" + h + ":8000";
        };
    }
})();
</script>
</head>
<body class="page-tabs-overview">
<div class="page">
    <header class="pos-header-bar">
        <button type="button" class="back-btn" onclick="back()">Zurück</button>
        <div class="pos-header-main">
            <div class="pos-header-title title">Deckel Übersicht</div>
            <div class="pos-header-subtitle subtitle">Offene Deckel kassieren</div>
        </div>
        <span class="pos-header-spacer" aria-hidden="true"></span>
    </header>

    <div class="content">
        <div id="tabsWrap" class="tabs-wrap">
            <div id="tabs" class="tabs-list"></div>
        </div>

        <div id="create" class="create" style="display:none">
            <input id="newName" placeholder="Deckelname" autocomplete="off">
            <div class="create-actions">
                <button type="button" class="btn btn-primary" onclick="submitCreateTab()">Speichern</button>
                <button type="button" class="btn btn-secondary" onclick="closeCreate()">Schließen</button>
            </div>
        </div>
    </div>
</div>

<div id="createConfirmModal" class="tab-create-confirm" style="display:none" aria-hidden="true">
    <div class="tab-create-confirm-backdrop" onclick="cancelCreateConfirm()"></div>
    <div class="tab-create-confirm-panel" role="dialog" aria-modal="true" aria-labelledby="createConfirmTitle">
        <h2 id="createConfirmTitle" class="tab-create-confirm-title">Neuen Deckel anlegen?</h2>
        <p class="tab-create-confirm-text">Vergewissere dich, dass für den Gast noch kein Deckel existiert.</p>
        <p id="createConfirmName" class="tab-create-confirm-name"></p>
        <div class="create-actions">
            <button type="button" class="btn btn-primary" onclick="confirmCreateTab()">Bestätigen</button>
            <button type="button" class="btn btn-secondary" onclick="cancelCreateConfirm()">Abbrechen</button>
        </div>
    </div>
</div>

<script src="api_base.js?v=10"></script>
<script src="gastro_nav.js?v=4"></script>
<script src="tab_tiles.js?v=7"></script>
<script src="tabs_overview.js?v=11"></script>
<script src="status.js?v=10"></script>
</body>
</html>
