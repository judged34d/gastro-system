<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terminal</title>
<script src="layout.js?v=1"></script>
<link rel="stylesheet" href="design-tokens.css?v=9">
<link rel="stylesheet" href="pos-chrome.css?v=2">
<link rel="stylesheet" href="layout-presets.css?v=3">
<link rel="stylesheet" href="station-order.css?v=1">
<link rel="stylesheet" href="terminal.css?v=4">
<link rel="stylesheet" href="status.css?v=2">
</head>
<body>

<div id="terminalHeader" class="terminal-header">
    <div id="stationName" class="terminal-title"></div>
    <div class="terminal-header-actions">
        <button type="button" class="header-btn btn-deckel" onclick="openTabsOverview()">Deckel</button>
    </div>
</div>

<div id="modeHome" class="mode-panel terminal-home">
    <button type="button" class="terminal-action-card terminal-action-new" onclick="setMode('order')">
        <span class="terminal-action-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="8" width="44" height="48" rx="6" stroke="currentColor" stroke-width="3"/>
                <path d="M22 18h20M22 28h20M22 38h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <circle cx="46" cy="46" r="14" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="3"/>
                <path d="M46 39v14M39 46h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="terminal-action-title">Neue Bestellung</span>
        <span class="terminal-action-hint">Artikel erfassen &amp; speichern</span>
    </button>
    <button type="button" class="terminal-action-card terminal-action-cashier btn-with-badge" onclick="setMode('cashier')">
        <span id="terminalCashierOpenBadge" class="btn-qty-badge terminal-action-badge" hidden aria-hidden="true"></span>
        <span class="terminal-action-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="14" width="48" height="36" rx="6" stroke="currentColor" stroke-width="3"/>
                <path d="M16 26h32M16 36h22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <circle cx="46" cy="40" r="12" stroke="currentColor" stroke-width="3"/>
                <path d="M46 34v12M40 40h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M20 50h24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="terminal-action-title">Offene Bestellungen</span>
        <span class="btn-with-badge-label terminal-action-hint">Kassieren &amp; abschließen</span>
    </button>
</div>

<div id="modeOrder" class="mode-panel" style="display:none">
    <div id="stationCategories" class="station-cats"></div>
    <div id="stationProducts" class="station-products-grid"></div>
    <div id="stationCart" class="station-cart"></div>
    <div class="station-bottom gastro-pos-footer">
        <div id="stationTotal" class="station-total">Gesamt: 0,00 €</div>
        <div class="station-buttons">
            <button type="button" class="header-btn header-btn-primary" onclick="submitTerminalOrder()">Speichern &amp; kassieren</button>
            <button type="button" class="header-btn btn-secondary back-btn" onclick="setMode('home')">Zurück</button>
        </div>
    </div>
</div>

<div id="modeCashier" class="mode-panel" style="display:none">
    <div class="terminal-cashier-bar">
        <button type="button" class="header-btn btn-secondary back-btn" onclick="setMode('home')">Zurück</button>
    </div>
    <div id="cashierOrders"></div>
</div>

<script src="api_base.js?v=10"></script>
<script src="open_order_badges.js?v=1"></script>
<script src="product_icons.js?v=5"></script>
<script src="station_order_alert.js?v=1"></script>
<script src="terminal.js?v=4"></script>
<script src="status.js?v=10"></script>
</body>
</html>
